name: Quality / Windows Gate

on:
  workflow_call:
    inputs:
      gate_mode:
        description: Repository gate to execute
        required: false
        default: daily
        type: string
      base_revision:
        description: Base commit used by the committed whitespace check
        required: false
        default: ""
        type: string
      checkout_ref:
        description: Optional branch, tag, or commit to check out
        required: false
        default: ""
        type: string
      release_tag:
        description: Version tag required by the release gate
        required: false
        default: ""
        type: string
      expected_broker_publisher:
        description: Exact Authenticode publisher required by the release gate
        required: false
        default: ""
        type: string
    secrets:
      windows_signing_pfx_base64:
        description: Base64-encoded production Windows code-signing PFX
        required: false
      windows_signing_pfx_password:
        description: Password for the production Windows code-signing PFX
        required: false
    outputs:
      signed_bundle_artifact:
        description: Immutable signed Windows bundle artifact produced by the release gate
        value: ${{ jobs.release_windows.outputs.signed_bundle_artifact }}

permissions:
  contents: read

jobs:
  daily_components:
    name: Daily / ${{ matrix.label }}
    if: inputs.gate_mode == 'daily'
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: static
            label: Static and Rust
          - component: flutter
            label: Flutter Tests
          - component: windows_scan
            label: Windows Scan
          - component: windows_accessibility
            label: Windows Accessibility
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install pinned actionlint
        if: matrix.component == 'static'
        id: actionlint
        shell: pwsh
        run: |
          $version = "1.7.12"
          $archiveName = "actionlint_${version}_windows_amd64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installPath = Join-Path $env:RUNNER_TEMP "actionlint-$version"
          $expectedHash = "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"
          $downloadUri = (
            "https://github.com/rhysd/actionlint/releases/download/" +
            "v$version/$archiveName"
          )
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri $downloadUri -OutFile $archivePath
          $actualHash = (
            Get-FileHash -LiteralPath $archivePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "actionlint checksum mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installPath
          "path=$installPath\actionlint.exe" >> $env:GITHUB_OUTPUT

      - name: Lint GitHub Actions workflows
        if: matrix.component == 'static'
        shell: pwsh
        env:
          AME_ACTIONLINT_PATH: ${{ steps.actionlint.outputs.path }}
        run: ./tool/quality_lint_workflows.ps1 -ActionlintPath $env:AME_ACTIONLINT_PATH

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
          pub-cache: true

      - name: Report toolchain
        shell: pwsh
        run: |
          flutter --version
          dart --version
          rustc --version
          cargo --version

      - name: Restore locked Dart dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile

      - name: Run Windows PowerShell platform compatibility probes
        if: matrix.component == 'static'
        shell: powershell
        run: |
          ./tool/quality_test_windows_powershell_compatibility.ps1
          ./tool/release_test_journal_broker_installer_guardrails.ps1

      - name: Run daily component
        shell: pwsh
        env:
          AME_DAILY_COMPONENT: ${{ matrix.component }}
        run: ./tool/quality_verify_daily.ps1 -Component $env:AME_DAILY_COMPONENT

      - name: Check committed whitespace
        if: matrix.component == 'static'
        shell: pwsh
        env:
          AME_BASE_REVISION: ${{ inputs.base_revision }}
        run: ./tool/quality_verify_git_range.ps1 -BaseRevision $env:AME_BASE_REVISION

  release_windows:
    name: Release Candidate
    if: inputs.gate_mode == 'release'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CI: "true"
    outputs:
      signed_bundle_artifact: ${{ steps.signed_artifact.outputs.name }}
    steps:
      - name: Validate release request
        shell: pwsh
        env:
          AME_EXPECTED_PUBLISHER: ${{ inputs.expected_broker_publisher }}
          AME_RELEASE_TAG: ${{ inputs.release_tag }}
          AME_SIGNING_PFX_BASE64: ${{ secrets.windows_signing_pfx_base64 }}
          AME_SIGNING_PFX_PASSWORD: ${{ secrets.windows_signing_pfx_password }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AME_RELEASE_TAG)) {
            throw "Release gate requires a version tag"
          }
          if ([string]::IsNullOrWhiteSpace($env:AME_EXPECTED_PUBLISHER)) {
            throw "Release gate requires the exact Windows Authenticode publisher"
          }
          if ([string]::IsNullOrWhiteSpace($env:AME_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:AME_SIGNING_PFX_PASSWORD)) {
            throw "Release gate requires production Windows signing credentials"
          }

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install pinned actionlint
        id: actionlint
        shell: pwsh
        run: |
          $version = "1.7.12"
          $archiveName = "actionlint_${version}_windows_amd64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installPath = Join-Path $env:RUNNER_TEMP "actionlint-$version"
          $expectedHash = "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"
          $downloadUri = (
            "https://github.com/rhysd/actionlint/releases/download/" +
            "v$version/$archiveName"
          )
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri $downloadUri -OutFile $archivePath
          $actualHash = (
            Get-FileHash -LiteralPath $archivePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "actionlint checksum mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installPath
          "path=$installPath\actionlint.exe" >> $env:GITHUB_OUTPUT

      - name: Lint GitHub Actions workflows
        shell: pwsh
        env:
          AME_ACTIONLINT_PATH: ${{ steps.actionlint.outputs.path }}
        run: ./tool/quality_lint_workflows.ps1 -ActionlintPath $env:AME_ACTIONLINT_PATH

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
          pub-cache: true

      - name: Report toolchain
        shell: pwsh
        run: |
          flutter --version
          dart --version
          rustc --version
          cargo --version

      - name: Restore locked Dart dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile

      - name: Validate release version
        shell: pwsh
        env:
          AME_RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./tool/release_validate_version.ps1 -Tag $env:AME_RELEASE_TAG

      - name: Build and sign immutable Windows bundle
        shell: pwsh
        env:
          AME_EXPECTED_PUBLISHER: ${{ inputs.expected_broker_publisher }}
          AME_SIGNING_PFX_BASE64: ${{ secrets.windows_signing_pfx_base64 }}
          AME_SIGNING_PFX_PASSWORD: ${{ secrets.windows_signing_pfx_password }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "cedarflake-ame-signing.pfx"
          $importedThumbprints = [System.Collections.Generic.List[string]]::new()
          $preexistingThumbprints = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase
          )
          foreach ($certificate in @(Get-ChildItem Cert:\CurrentUser\My)) {
            $null = $preexistingThumbprints.Add($certificate.Thumbprint)
          }
          $signingFailure = $null
          $cleanupFailures = [System.Collections.Generic.List[string]]::new()
          try {
            flutter build windows --release
            if ($LASTEXITCODE -ne 0) {
              throw "Windows Release build failed"
            }
            cargo build `
              --locked `
              --manifest-path rust\Cargo.toml `
              --release `
              --bin cedarflake_ame_journal_broker
            if ($LASTEXITCODE -ne 0) {
              throw "Journal broker Release build failed"
            }
            [System.IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:AME_SIGNING_PFX_BASE64)
            )
            $password = ConvertTo-SecureString `
              $env:AME_SIGNING_PFX_PASSWORD `
              -AsPlainText `
              -Force
            $imported = @(Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password `
              -Exportable:$false)
            foreach ($certificate in $imported) {
              if ($preexistingThumbprints.Contains($certificate.Thumbprint)) {
                throw "Signing PFX contains a certificate already present in CurrentUser My"
              }
              $importedThumbprints.Add($certificate.Thumbprint)
            }
            $signingCertificates = @($imported | Where-Object {
              $_.HasPrivateKey -and
              $_.Subject -ceq $env:AME_EXPECTED_PUBLISHER -and
              @($_.EnhancedKeyUsageList | Where-Object {
                $_.ObjectId.Value -eq "1.3.6.1.5.5.7.3.3"
              }).Count -gt 0
            })
            if ($signingCertificates.Count -ne 1) {
              throw "Signing PFX must contain exactly one matching code-signing certificate"
            }
            $releaseRoot = [System.IO.Path]::GetFullPath(
              "build\windows\x64\runner\Release"
            )
            $applicationPath = Join-Path $releaseRoot "cedarflake_ame.exe"
            $brokerSource = [System.IO.Path]::GetFullPath(
              "rust\target\release\cedarflake_ame_journal_broker.exe"
            )
            $brokerPath = Join-Path $releaseRoot "cedarflake_ame_journal_broker.exe"
            Copy-Item -LiteralPath $brokerSource -Destination $brokerPath -Force
            foreach ($binary in @($applicationPath, $brokerPath)) {
              $signature = Set-AuthenticodeSignature `
                -LiteralPath $binary `
                -Certificate $signingCertificates[0] `
                -HashAlgorithm SHA256 `
                -TimestampServer "http://timestamp.digicert.com"
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
                throw "Authenticode signing failed for $binary with $($signature.Status)"
              }
            }
            . ./tool/release_journal_broker_common.ps1
            Assert-AmeSignedX64Binary `
              -Path $applicationPath `
              -ExpectedPublisher $env:AME_EXPECTED_PUBLISHER | Out-Null
            Assert-AmeBrokerBinary `
              -Path $brokerPath `
              -ExpectedPublisher $env:AME_EXPECTED_PUBLISHER | Out-Null
          } catch {
            $signingFailure = $_
          } finally {
            foreach ($thumbprint in $importedThumbprints) {
              try {
                $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
                if (Test-Path -LiteralPath $certificatePath) {
                  Remove-Item -LiteralPath $certificatePath -Force
                }
                if (Test-Path -LiteralPath $certificatePath) {
                  throw "Imported signing certificate still exists after cleanup"
                }
              } catch {
                $cleanupFailures.Add($_.Exception.Message)
              }
            }
            try {
              if (Test-Path -LiteralPath $pfxPath) {
                Remove-Item -LiteralPath $pfxPath -Force
              }
              if (Test-Path -LiteralPath $pfxPath) {
                throw "Temporary signing PFX still exists after cleanup"
              }
            } catch {
              $cleanupFailures.Add($_.Exception.Message)
            }
          }
          if ($cleanupFailures.Count -gt 0) {
            $cleanupMessage = $cleanupFailures -join "; "
            if ($null -ne $signingFailure) {
              throw "$($signingFailure.Exception.Message); cleanup failures: $cleanupMessage"
            }
            throw $cleanupMessage
          }
          if ($null -ne $signingFailure) {
            throw $signingFailure
          }

      - name: Run release candidate gate
        shell: pwsh
        env:
          AME_EXPECTED_PUBLISHER: ${{ inputs.expected_broker_publisher }}
        run: |
          $releaseRoot = [System.IO.Path]::GetFullPath(
            "build\windows\x64\runner\Release"
          )
          $brokerPath = Join-Path $releaseRoot "cedarflake_ame_journal_broker.exe"
          ./tool/release_verify_candidate.ps1 `
            -ExpectedBrokerPublisher $env:AME_EXPECTED_PUBLISHER `
            -SignedBrokerBinaryPath $brokerPath `
            -SignedApplicationBundlePath $releaseRoot

      - name: Check committed whitespace
        shell: pwsh
        env:
          AME_BASE_REVISION: ${{ inputs.base_revision }}
        run: ./tool/quality_verify_git_range.ps1 -BaseRevision $env:AME_BASE_REVISION

      - name: Name signed Windows bundle artifact
        id: signed_artifact
        shell: pwsh
        env:
          AME_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          "name=Cedarflake-Ame-$env:AME_RELEASE_TAG-signed-windows-x64" >> `
            $env:GITHUB_OUTPUT

      - name: Upload immutable signed Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.signed_artifact.outputs.name }}
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 1

  quality_windows:
    name: Windows Gate
    if: always()
    needs:
      - daily_components
      - release_windows
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      AME_DAILY_RESULT: ${{ needs.daily_components.result }}
      AME_GATE_MODE: ${{ inputs.gate_mode }}
      AME_RELEASE_RESULT: ${{ needs.release_windows.result }}
    steps:
      - name: Verify requested gate succeeded
        shell: pwsh
        run: |
          if ($env:AME_GATE_MODE -eq "daily") {
            if ($env:AME_DAILY_RESULT -ne "success") {
              throw "One or more hosted daily components failed"
            }
            exit 0
          }
          if ($env:AME_GATE_MODE -eq "release") {
            if ($env:AME_RELEASE_RESULT -ne "success") {
              throw "The release candidate gate failed"
            }
            exit 0
          }
          throw "Unsupported gate mode: $env:AME_GATE_MODE"

name: Release / Candidate Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to verify and publish
        required: true
        type: string
      expected_broker_publisher:
        description: Exact Authenticode publisher for the Windows binaries
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release_windows:
    name: Windows Candidate Gate
    permissions:
      contents: read
    uses: ./.github/workflows/quality_gate_windows.yml
    with:
      gate_mode: release
      checkout_ref: ${{ github.event.inputs.release_tag || github.sha }}
      release_tag: ${{ github.event.inputs.release_tag || github.ref_name }}
      expected_broker_publisher: ${{ github.event.inputs.expected_broker_publisher || vars.AME_WINDOWS_EXPECTED_PUBLISHER }}
    secrets:
      windows_signing_pfx_base64: ${{ secrets.AME_WINDOWS_SIGNING_PFX_BASE64 }}
      windows_signing_pfx_password: ${{ secrets.AME_WINDOWS_SIGNING_PFX_PASSWORD }}

  publish_portable:
    name: Windows Portable ZIP
    needs: release_windows
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CI: "true"
      AME_EXPECTED_PUBLISHER: ${{ github.event.inputs.expected_broker_publisher || vars.AME_WINDOWS_EXPECTED_PUBLISHER }}
      AME_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.release_tag || github.sha }}

      - name: Validate publication identity
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AME_EXPECTED_PUBLISHER)) {
            throw "Portable publication requires the exact Authenticode publisher"
          }

      - name: Download immutable signed Windows bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.release_windows.outputs.signed_bundle_artifact }}
          path: build/signed-windows

      - name: Reverify downloaded signed Windows bundle
        shell: pwsh
        run: |
          . ./tool/release_journal_broker_common.ps1
          $releaseRoot = [System.IO.Path]::GetFullPath("build\signed-windows")
          Assert-AmeApplicationBundleSource `
            -BundlePath $releaseRoot `
            -ExpectedPublisher $env:AME_EXPECTED_PUBLISHER | Out-Null
          Assert-AmeBrokerBinary `
            -Path (Join-Path $releaseRoot "cedarflake_ame_journal_broker.exe") `
            -ExpectedPublisher $env:AME_EXPECTED_PUBLISHER | Out-Null

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $archivePath = (
            ./tool/release_package_portable_windows.ps1 `
              -Tag $env:AME_RELEASE_TAG `
              -ReleaseRoot ([System.IO.Path]::GetFullPath("build\signed-windows")) `
              -ExpectedBrokerPublisher $env:AME_EXPECTED_PUBLISHER |
              Select-Object -Last 1
          )
          "AME_PORTABLE_ARCHIVE=$archivePath" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          gh release view $env:AME_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if ($releaseExists) {
            gh release upload $env:AME_RELEASE_TAG `
              $env:AME_PORTABLE_ARCHIVE `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            $arguments = @(
              "release",
              "create",
              $env:AME_RELEASE_TAG,
              $env:AME_PORTABLE_ARCHIVE,
              "--repo",
              $env:GITHUB_REPOSITORY,
              "--verify-tag",
              "--title",
              "Cedarflake Ame $env:AME_RELEASE_TAG",
              "--generate-notes"
            )
            if ($env:AME_RELEASE_TAG.Contains("-")) {
              $arguments += "--prerelease"
            }
            & gh $arguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed"
          }

name: Release / Publish Windows

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      trusted_workflow_commit:
        required: true
        type: string
      package_artifact:
        required: true
        type: string
      package_run:
        default: ""
        type: string
      package_artifact_id:
        default: ""
        type: string
      archive_name:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
      installer_name:
        required: true
        type: string
      installer_sha256:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish_windows:
    name: Windows ZIP and MSI
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      AME_ARCHIVE_NAME: ${{ inputs.archive_name }}
      AME_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      AME_INSTALLER_NAME: ${{ inputs.installer_name }}
      AME_INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
      AME_RELEASE_TAG: ${{ inputs.release_tag }}
      AME_SOURCE_COMMIT: ${{ inputs.source_commit }}
      AME_NOTES_COMMIT: ${{ inputs.trusted_workflow_commit }}
    steps:
      - name: Download immutable ZIP and MSI
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.package_artifact_id == '' && inputs.package_artifact || '' }}
          artifact-ids: ${{ inputs.package_artifact_id }}
          run-id: ${{ inputs.package_run || github.run_id }}
          github-token: ${{ github.token }}
          path: build/publish

      - name: Validate immutable package pair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AME_SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:AME_ARCHIVE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:AME_INSTALLER_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:AME_ARCHIVE_NAME -cne "Cedarflake-Ame-$env:AME_RELEASE_TAG-windows-x64-portable.zip" -or
              $env:AME_INSTALLER_NAME -cne "Cedarflake-Ame-$env:AME_RELEASE_TAG-windows-x64.msi") {
            throw 'Publication package identities are invalid'
          }
          $items = @(Get-ChildItem -LiteralPath 'build/publish' -Force)
          $expected = @($env:AME_ARCHIVE_NAME, $env:AME_INSTALLER_NAME)
          if ($items.Count -ne 2) { throw 'Publication requires exactly one ZIP and one MSI' }
          foreach ($item in $items) {
            if ($item.PSIsContainer -or $expected -cnotcontains $item.Name -or
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Publication artifact contains an unexpected entry'
            }
          }

      - name: Read versioned release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AME_NOTES_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Release notes require the immutable workflow commit'
          }
          $notesPath = "docs/releases/$env:AME_RELEASE_TAG.md"
          $tag = [Uri]::EscapeDataString($env:AME_RELEASE_TAG)
          $record = gh api "repos/$env:GITHUB_REPOSITORY/contents/docs/releases/$tag.md?ref=$env:AME_NOTES_COMMIT" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read release notes: $notesPath" }
          if ($record.type -cne 'file' -or $record.path -cne $notesPath -or
              $record.encoding -cne 'base64' -or $record.size -le 0 -or $record.size -gt 65536) {
            throw 'Release notes must be a nonempty Markdown file of at most 64 KiB'
          }
          $bytes = [Convert]::FromBase64String($record.content)
          $text = [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
          if ($bytes.Length -ne $record.size -or [string]::IsNullOrWhiteSpace($text)) {
            throw 'Release notes have invalid or empty content'
          }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'build/release-notes.md'), $bytes)

      - name: Publish GitHub Release from the verified source commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Resolve-ReleaseTagCommit {
            $refRecord = gh api `
              "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:AME_RELEASE_TAG" |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub release tag lookup failed"
            }
            $objectType = [string]$refRecord.object.type
            $objectSha = [string]$refRecord.object.sha
            for ($depth = 0; $objectType -ceq "tag"; $depth += 1) {
              if ($depth -ge 8 -or $objectSha -cnotmatch '^[0-9a-f]{40}$') {
                throw "GitHub release tag annotation chain is invalid"
              }
              $tagRecord = gh api `
                "repos/$env:GITHUB_REPOSITORY/git/tags/$objectSha" |
                ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) {
                throw "GitHub annotated release tag lookup failed"
              }
              $objectType = [string]$tagRecord.object.type
              $objectSha = [string]$tagRecord.object.sha
            }
            if (
              $objectType -cne "commit" -or
              $objectSha -cnotmatch '^[0-9a-f]{40}$'
            ) {
              throw "GitHub release tag does not resolve to one commit"
            }
            return $objectSha
          }

          function Find-ReleaseForTag {
            param([string]$Endpoint, [hashtable]$Headers, [string]$ReleaseTag)

            $matchedRelease = $null
            $page = 1
            do {
              $response = Invoke-WebRequest -Uri "${Endpoint}?per_page=100&page=$page" `
                -Headers $Headers -SkipHttpErrorCheck -TimeoutSec 30
              if ($response.StatusCode -ne 200) { throw "GitHub release lookup failed with HTTP $($response.StatusCode)" }
              if (-not ([string]$response.Content).TrimStart().StartsWith('[')) {
                throw 'GitHub release lookup did not return a release array'
              }
              [object[]]$pageReleases = ConvertFrom-Json -InputObject $response.Content
              if ($null -eq $pageReleases) { $pageReleases = @() }
              foreach ($release in $pageReleases) {
                if ($release.tag_name -cne $ReleaseTag) { continue }
                if ($null -ne $matchedRelease) { throw 'GitHub has multiple releases for the requested tag' }
                $matchedRelease = $release
              }
              $page += 1
            } while ($pageReleases.Count -eq 100)
            return $matchedRelease
          }

          function Get-ReleasePublicationPlan {
            param([string]$Repository, [string]$ReleaseTag, [object[]]$Artifacts, [string]$Token)

            $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $Token"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $endpoint = "https://api.github.com/repos/$Repository/releases"
            $release = Find-ReleaseForTag -Endpoint $endpoint -Headers $headers -ReleaseTag $ReleaseTag
            if ($null -eq $release) {
              return [pscustomobject]@{ Create = $true; Draft = $true; Missing = @($Artifacts.Name) }
            }
            if ([string]$release.id -cnotmatch '^[1-9][0-9]*$' -or $release.tag_name -cne $ReleaseTag -or
                $release.draft -isnot [bool]) { throw 'GitHub release lookup returned an invalid release identity' }

            $matching = @{}
            $page = 1
            do {
              $response = Invoke-WebRequest -Uri "$endpoint/$($release.id)/assets?per_page=100&page=$page" `
                -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30
              if ($response.StatusCode -ne 200) { throw "GitHub release asset lookup failed with HTTP $($response.StatusCode)" }
              if (-not ([string]$response.Content).TrimStart().StartsWith('[')) {
                throw 'GitHub release asset lookup did not return an asset array'
              }
              [object[]]$pageAssets = ConvertFrom-Json -InputObject $response.Content
              if ($null -eq $pageAssets) { $pageAssets = @() }
              foreach ($asset in $pageAssets) {
                if ($Artifacts.Name -ccontains $asset.name) {
                  if ($matching.ContainsKey($asset.name)) { throw 'GitHub release has ambiguous same-name assets' }
                  $matching[$asset.name] = $asset
                }
              }
              $page += 1
            } while ($pageAssets.Count -eq 100)

            $missing = @()
            foreach ($artifact in $Artifacts) {
              if (-not $matching.ContainsKey($artifact.Name)) { $missing += $artifact.Name; continue }
              $asset = $matching[$artifact.Name]
              $digest = $asset.PSObject.Properties['digest']
              if ($asset.state -cne 'uploaded' -or $null -eq $digest -or
                  [string]$digest.Value -cnotmatch '^sha256:[0-9a-f]{64}$') {
                throw 'Existing release asset has no trustworthy uploaded SHA-256 digest'
              }
              if ([string]$digest.Value -cne "sha256:$($artifact.Sha256)") {
                throw 'Existing release asset differs from the verified package identity'
              }
            }
            return [pscustomobject]@{ Create = $false; Draft = $release.draft; Missing = $missing }
          }

          $artifacts = @(
            [pscustomobject]@{ Name = $env:AME_ARCHIVE_NAME; Sha256 = $env:AME_ARCHIVE_SHA256 }
            [pscustomobject]@{ Name = $env:AME_INSTALLER_NAME; Sha256 = $env:AME_INSTALLER_SHA256 }
          )
          foreach ($artifact in $artifacts) {
            $path = Join-Path ((Join-Path $PWD 'build/publish')) $artifact.Name
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $artifact.Sha256) {
              throw 'Release package changed immediately before publication'
            }
          }
          if ((Resolve-ReleaseTagCommit) -cne $env:AME_SOURCE_COMMIT) {
            throw 'GitHub release tag moved after candidate verification'
          }
          $plan = Get-ReleasePublicationPlan -Repository $env:GITHUB_REPOSITORY -ReleaseTag $env:AME_RELEASE_TAG `
            -Artifacts $artifacts -Token $env:GH_TOKEN
          if ($plan.Create) {
            $arguments = @('release', 'create', $env:AME_RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY,
              '--verify-tag', '--draft', '--title', "Cedarflake Ame $env:AME_RELEASE_TAG",
              '--notes-file', (Join-Path $PWD 'build/release-notes.md'))
            if ($env:AME_RELEASE_TAG.Contains('-')) { $arguments += '--prerelease' }
            & gh $arguments
            if ($LASTEXITCODE -ne 0) { throw 'GitHub draft release creation failed' }
          }
          if ($plan.Missing.Count -gt 0) {
            $paths = @($plan.Missing | ForEach-Object { Join-Path ((Join-Path $PWD 'build/publish')) $_ })
            gh release upload $env:AME_RELEASE_TAG @paths --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'GitHub package upload failed; the new release remains a draft' }
          }
          $verified = Get-ReleasePublicationPlan -Repository $env:GITHUB_REPOSITORY -ReleaseTag $env:AME_RELEASE_TAG `
            -Artifacts $artifacts -Token $env:GH_TOKEN
          if ($verified.Create -or $verified.Missing.Count -ne 0) { throw 'Release requires both verified ZIP and MSI assets' }
          if ((Resolve-ReleaseTagCommit) -cne $env:AME_SOURCE_COMMIT) {
            throw 'GitHub release tag moved before publication'
          }
          gh release edit $env:AME_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false `
            --notes-file (Join-Path $PWD 'build/release-notes.md')
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
          Write-Host 'Published release contains the verified ZIP and MSI'

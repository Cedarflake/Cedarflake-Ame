name: Quality / Daily Windows

on:
  workflow_call:
    inputs:
      base_revision:
        required: false
        default: ""
        type: string
      checkout_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  components:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: static
            label: Static
            timeout_minutes: 90
          - component: rust_catalog_history
            label: Rust / Schema and Queue
            timeout_minutes: 90
          - component: rust_catalog
            label: Rust / Catalog
            timeout_minutes: 90
          - component: rust_sync_scan
            label: Rust / Synchronization and Scan
            timeout_minutes: 90
          - component: rust_other
            label: Rust / Remaining
            timeout_minutes: 90
          - component: flutter
            label: Flutter Tests
            timeout_minutes: 60
          - component: windows_scan
            label: Windows Scan
            timeout_minutes: 60
          - component: windows_accessibility
            label: Windows Accessibility
            timeout_minutes: 60
    runs-on: windows-2025
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install pinned actionlint
        if: matrix.component == 'static'
        id: actionlint
        shell: pwsh
        run: |
          $version = "1.7.12"
          $archiveName = "actionlint_${version}_windows_amd64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installPath = Join-Path $env:RUNNER_TEMP "actionlint-$version"
          $expectedHash = "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"
          $downloadUri = (
            "https://github.com/rhysd/actionlint/releases/download/" +
            "v$version/$archiveName"
          )
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri $downloadUri -OutFile $archivePath
          $actualHash = (
            Get-FileHash -LiteralPath $archivePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "actionlint checksum mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installPath
          "path=$installPath\actionlint.exe" >> $env:GITHUB_OUTPUT

      - name: Lint GitHub Actions workflows
        if: matrix.component == 'static'
        shell: pwsh
        env:
          AME_ACTIONLINT_PATH: ${{ steps.actionlint.outputs.path }}
        run: ./tool/quality_lint_workflows.ps1 -ActionlintPath $env:AME_ACTIONLINT_PATH

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
          pub-cache: true

      - name: Report toolchain
        shell: pwsh
        run: |
          flutter --version
          dart --version
          rustc --version
          cargo --version

      - name: Restore locked Dart dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile

      - name: Run Windows PowerShell platform compatibility probes
        if: matrix.component == 'static'
        shell: powershell
        run: |
          ./tool/quality_test_windows_powershell_compatibility.ps1
          ./tool/release_test_journal_broker_installer_guardrails.ps1
          ./tool/acceptance_test_windows_journal_broker_guardrails.ps1

      - name: Run daily component
        shell: pwsh
        env:
          AME_DAILY_COMPONENT: ${{ matrix.component }}
        run: ./tool/quality_verify_daily.ps1 -Component $env:AME_DAILY_COMPONENT

      - name: Check committed whitespace
        if: matrix.component == 'static'
        shell: pwsh
        env:
          AME_BASE_REVISION: ${{ inputs.base_revision }}
        run: ./tool/quality_verify_git_range.ps1 -BaseRevision $env:AME_BASE_REVISION

      - name: Retain controlled scan diagnostics
        if: always() && matrix.component == 'windows_scan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-scan-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/integration-storage-*/flutter.stdout.log
            build/integration-storage-*/flutter.stderr.log
            build/integration-storage-*/completion.json
          if-no-files-found: warn
          retention-days: 7


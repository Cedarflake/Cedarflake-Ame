name: cedarflake_ame
description: >-
  A local-first Windows image organizer for large personal image libraries.
publish_to: "none"
version: 0.1.0-beta.1+4

environment:
  sdk: ^3.12.2
  flutter: ">=3.50.0"

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  material_symbols_icons: 4.2960.0
  material_ui: 1.11.1
  rust_lib_cedarflake_ame:
    path: rust_builder
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.6
  window_manager: ^0.5.2

dev_dependencies:
  analyzer: 14.7.0
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/similarity.txt
    - assets/licenses/classification_schema.txt
    - assets/licenses/material_loading_indicator.txt
    - assets/branding/ame_light.png
    - assets/branding/ame_outline.png

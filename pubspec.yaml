name: cedarflake_ame
description: >-
  A local-first Windows workspace for understanding and organizing very large personal image
  collections.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.1.0
  material_symbols_icons: 4.2960.0
  rust_lib_cedarflake_ame:
    path: rust_builder
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.5
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

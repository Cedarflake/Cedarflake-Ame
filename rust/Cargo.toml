[package]
name = "rust_lib_cedarflake_ame"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
broker-acceptance-client = []
classification-worker = ["dep:ort", "dep:sha2", "dep:tokenizers"]

[[bin]]
name = "cedarflake_ame_classification_worker"
path = "src/bin/cedarflake_ame_classification_worker.rs"
required-features = ["classification-worker"]

[[bin]]
name = "cedarflake_ame_broker_acceptance_client"
path = "src/bin/cedarflake_ame_broker_acceptance_client.rs"
required-features = ["broker-acceptance-client"]

[dependencies]
blake3 = "=1.8.6"
directories = "6.0.0"
flutter_rust_bridge = "=2.12.0"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
kamadak-exif = "=0.6.1"
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "load-dynamic", "api-31"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled", "hooks"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.10.9", optional = true }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokenizers = { version = "=0.23.2", optional = true, default-features = false, features = ["fancy-regex"] }
zune-core = { version = "=0.5.1", features = ["std"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[target."cfg(windows)".dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Search", "Win32_System_Variant", "Win32_Storage_IndexServer", "Win32_UI_Shell"] }
notify = { version = "=8.2.0", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_CloudFilters",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Com",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[patch.crates-io]
notify = { path = "vendor/notify" }

[dev-dependencies]
quote = "=1.0.47"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }
